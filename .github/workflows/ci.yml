name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python services ───────────────────────────────────────────────
  python-tests:
    name: "Python: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - fastapi_gateway
          - oracle_engine
          - crew_ai
          - risk_profiler
          - rag_orchestrator
          - rasa_assistant
          - web_intelligence
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - name: Install test deps
        run: |
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest ruff
      - run: ruff check . --no-fix || true
      - run: pytest tests/ -v --tb=short || echo "No tests found or tests failed"

  # ── Go kg_cache ───────────────────────────────────────────────────
  go-tests:
    name: "Go: kg_cache"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kg_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: services/kg_cache/go.sum
      - run: go vet ./...
      - run: go test ./...

  # ── Docker build verification ─────────────────────────────────────
  docker-build:
    name: "Docker: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - fastapi_gateway
          - kg_cache
          - oracle_engine
          - crew_ai
          - isolation_forest_sidecar
          - rag_orchestrator
          - rasa_assistant
          - web_intelligence
          - risk_profiler
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t continuum-${{ matrix.service }}:ci services/${{ matrix.service }}

  # ── Integration tests ─────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests]
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: continuum_test
        ports: ["15432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      cockroachdb:
        image: cockroachdb/cockroach:latest-v23.1
        ports: ["16257:26257"]
        options: >-
          --health-cmd="curl -f http://localhost:8080/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_PG_DSN: postgresql://test:test@localhost:15432/continuum_test
      TEST_CRDB_DSN: postgresql://root@localhost:16257/defaultdb?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run PG migrations
        run: |
          for f in db/migrations/postgres/*.sql; do
            PGPASSWORD=test psql -h localhost -p 15432 -U test -d continuum_test -f "$f" || true
          done
      - name: Run CRDB migrations
        run: |
          for f in db/migrations/cockroachdb/*.sql; do
            cockroach sql --insecure --host=localhost:16257 --database=defaultdb < "$f" || true
          done
      - name: Install & run integration tests
        working-directory: tests/integration
        run: |
          npm install
          npm test || echo "Integration tests completed with issues"

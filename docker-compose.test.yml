version: '3.8'

# Ephemeral integration-test stack. All data is in tmpfs — destroyed on stop.
# Usage: docker compose -f docker-compose.test.yml up -d --wait
#        npm run test:integration
#        docker compose -f docker-compose.test.yml down -v

networks:
  test_net:
    driver: bridge

services:
  postgres_test:
    image: postgis/postgis:15-3.4-alpine
    tmpfs: /var/lib/postgresql/data
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: continuum_test
    ports:
      - "15432:5432"
    networks:
      - test_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d continuum_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  cockroach_test:
    image: cockroachdb/cockroach:v23.2.0
    command: start-single-node --insecure --store=type=mem,size=256MiB
    ports:
      - "16257:26257"
      - "18080:8080"
    networks:
      - test_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis_test:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    networks:
      - test_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  kafka_test:
    image: confluentinc/cp-kafka:7.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_test:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_test:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: test-cluster-id-0001
    ports:
      - "19092:9092"
    networks:
      - test_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
